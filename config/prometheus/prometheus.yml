global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: "fullstack-observability"

scrape_configs:

  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host-level metrics (CPU, RAM, disk, network) + the Trivy host-scan
  # textfile-collector output living alongside it
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          lane: "metrics"

  # Per-container resource metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8085"]
        labels:
          lane: "metrics"

  # Security lane: live container vulnerability-scan metrics
  - job_name: "trivy-watcher"
    static_configs:
      - targets: ["trivy-watcher:8086"]
        labels:
          lane: "security"
